version: "3.9"

services:
  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: autopilot-postgres
    environment:
      POSTGRES_DB: autopilot
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autopilot-internal

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autopilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autopilot-internal

  # ─────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autopilot-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://autopilot:autopilot@postgres:5432/autopilot
      - DATABASE_SYNC_URL=postgresql+psycopg2://autopilot:autopilot@postgres:5432/autopilot
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DEBUG=true
      - ALLOWED_ORIGINS=["http://localhost:3000"]
      - NGINX_CONFIG_DIR=/etc/nginx/conf.d/sites
      - REPOS_DIR=/data/repos
      - PROJECTS_DIR=/data/projects
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - project_data:/data
      - nginx_configs:/etc/nginx/conf.d/sites
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autopilot-internal
      - autopilot-network

  # ─────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autopilot-celery
    command: celery -A app.celery_worker.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://autopilot:autopilot@postgres:5432/autopilot
      - DATABASE_SYNC_URL=postgresql+psycopg2://autopilot:autopilot@postgres:5432/autopilot
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REPOS_DIR=/data/repos
      - PROJECTS_DIR=/data/projects
      - NGINX_CONFIG_DIR=/etc/nginx/conf.d/sites
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - project_data:/data
      - nginx_configs:/etc/nginx/conf.d/sites
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autopilot-internal
      - autopilot-network

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: autopilot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_configs:/etc/nginx/conf.d/sites:ro
    depends_on:
      - backend
    networks:
      - autopilot-internal
      - autopilot-network

  # ─────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autopilot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - autopilot-internal

volumes:
  postgres_data:
  redis_data:
  project_data:
  nginx_configs:

networks:
  autopilot-internal:
    driver: bridge
  autopilot-network:
    driver: bridge
    name: autopilot-network
